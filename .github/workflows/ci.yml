name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Lint backend (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  backend-tests:
    name: Pruebas backend (PostgreSQL real)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Las reglas contables se prueban contra el mismo motor de producción:
    # enums nativos, NUMERIC y SELECT ... FOR UPDATE no se comportan igual en SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contable
          POSTGRES_PASSWORD: contable
          POSTGRES_DB: contable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://contable:contable@localhost:5432/contable
      TEST_DATABASE_URL: postgresql+psycopg://contable:contable@localhost:5432/contable_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Verifica que las migraciones levanten el esquema desde cero, no solo los modelos.
      - name: Aplicar migraciones
        run: alembic upgrade head

      # Análisis dinámico: el código se ejecuta de verdad y se mide qué quedó cubierto.
      - name: Ejecutar pruebas con cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: backend/coverage.xml

  frontend:
    name: Lint y build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
